<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="850" height="780" viewBox="0 0 850 780">
  <!-- 배경 -->
  <rect x="0" y="0" width="850" height="780" fill="#ffffff"/>
  
  <!-- 제목 -->
  <text x="425" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#10b981">★ 신규 가입자</text>
  
  <!-- 1. 회원가입 선택 (시작) -->
  <ellipse cx="400" cy="55" rx="70" ry="22" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
  <text x="400" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">1. 회원가입 선택</text>
  
  <!-- 화살표 -->
  <line x1="400" y1="77" x2="400" y2="100" stroke="#64748b" stroke-width="2"/>
  <polygon points="400,107 395,97 405,97" fill="#64748b"/>
  
  <!-- 2. 마름모: 가입 방식? -->
  <polygon points="400,110 480,150 400,190 320,150" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="500">가입 방식?</text>
  
  <!-- 왼쪽: 일반 가입 -->
  <line x1="320" y1="150" x2="150" y2="150" stroke="#64748b" stroke-width="2"/>
  <line x1="150" y1="150" x2="150" y2="315" stroke="#64748b" stroke-width="2"/>
  <line x1="150" y1="315" x2="293" y2="315" stroke="#64748b" stroke-width="2"/>
  <polygon points="300,315 290,310 290,320" fill="#64748b"/>
  <text x="235" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#16a34a" font-weight="bold">일반</text>
  
  <!-- 오른쪽: 소셜 가입 -->
  <line x1="480" y1="150" x2="650" y2="150" stroke="#64748b" stroke-width="2"/>
  <line x1="650" y1="150" x2="650" y2="200" stroke="#64748b" stroke-width="2"/>
  <polygon points="650,207 645,197 655,197" fill="#64748b"/>
  <text x="565" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc2626" font-weight="bold">소셜</text>
  
  <!-- 소셜: 개인정보 처리동의 -->
  <rect x="530" y="210" width="240" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="650" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">소셜(카카오,네이버)</text>
  <text x="650" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">개인정보 처리동의 Alert</text>
  
  <!-- 소셜 → 약관동의로 연결 -->
  <line x1="650" y1="255" x2="650" y2="315" stroke="#64748b" stroke-width="2"/>
  <line x1="650" y1="315" x2="507" y2="315" stroke="#64748b" stroke-width="2"/>
  <polygon points="500,315 510,310 510,320" fill="#64748b"/>
  
  <!-- 3. 약관동의 (통합) -->
  <rect x="300" y="295" width="200" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">3. 약관동의</text>
  
  <!-- 화살표 -->
  <line x1="400" y1="335" x2="400" y2="358" stroke="#64748b" stroke-width="2"/>
  <polygon points="400,365 395,355 405,355" fill="#64748b"/>
  
  <!-- 4. 본인인증 -->
  <rect x="300" y="368" width="200" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">4. 본인인증 페이지</text>
  
  <!-- 화살표 -->
  <line x1="400" y1="408" x2="400" y2="431" stroke="#64748b" stroke-width="2"/>
  <polygon points="400,438 395,428 405,428" fill="#64748b"/>
  
  <!-- 마름모: 기존 CI 있음? -->
  <polygon points="400,443 480,483 400,523 320,483" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="500">기존 CI 있음?</text>
  
  <!-- CI 있음: 기가입 안내 -->
  <line x1="320" y1="483" x2="150" y2="483" stroke="#64748b" stroke-width="2"/>
  <line x1="150" y1="483" x2="150" y2="533" stroke="#64748b" stroke-width="2"/>
  <polygon points="150,540 145,530 155,530" fill="#64748b"/>
  <text x="235" y="473" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#16a34a" font-weight="bold">있음</text>
  
  <rect x="70" y="543" width="160" height="45" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="150" y="563" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#991b1b">기 가입 안내</text>
  <text x="150" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#991b1b">(ID가 있음을 안내)</text>
  
  <!-- CI 없음: 소셜 가입? -->
  <line x1="480" y1="483" x2="600" y2="483" stroke="#64748b" stroke-width="2"/>
  <line x1="600" y1="483" x2="600" y2="518" stroke="#64748b" stroke-width="2"/>
  <polygon points="600,525 595,515 605,515" fill="#64748b"/>
  <text x="540" y="473" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc2626" font-weight="bold">없음</text>
  
  <!-- 마름모: 소셜 가입? -->
  <polygon points="600,528 670,563 600,598 530,563" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="600" y="566" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="500">소셜 가입?</text>
  
  <!-- 소셜 Yes: 생체정보 -->
  <line x1="530" y1="563" x2="430" y2="563" stroke="#64748b" stroke-width="2"/>
  <line x1="430" y1="563" x2="430" y2="613" stroke="#64748b" stroke-width="2"/>
  <polygon points="430,620 425,610 435,610" fill="#64748b"/>
  <text x="480" y="553" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#16a34a" font-weight="bold">Yes</text>
  
  <!-- 소셜 No: 회원가입 -->
  <line x1="670" y1="563" x2="750" y2="563" stroke="#64748b" stroke-width="2"/>
  <line x1="750" y1="563" x2="750" y2="613" stroke="#64748b" stroke-width="2"/>
  <polygon points="750,620 745,610 755,610" fill="#64748b"/>
  <text x="710" y="553" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc2626" font-weight="bold">No</text>
  
  <!-- 5. 회원가입 페이지 -->
  <rect x="660" y="623" width="180" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="750" y="643" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">5. 회원가입 페이지</text>
  <text x="750" y="658" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">(ID/PASS 설정)</text>
  
  <!-- 6. 생체정보 -->
  <rect x="330" y="623" width="200" height="45" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="430" y="643" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">6. 생체정보 페이지</text>
  <text x="430" y="658" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">(키, 몸무게, 보건소)</text>
  
  <!-- 회원가입 → 생체정보 합류 -->
  <line x1="750" y1="668" x2="750" y2="688" stroke="#64748b" stroke-width="2"/>
  <line x1="750" y1="688" x2="430" y2="688" stroke="#64748b" stroke-width="2"/>
  <line x1="430" y1="668" x2="430" y2="688" stroke="#64748b" stroke-width="2"/>
  <line x1="430" y1="688" x2="430" y2="708" stroke="#64748b" stroke-width="2"/>
  <polygon points="430,715 425,705 435,705" fill="#64748b"/>
  
  <!-- 7. 가입완료 -->
  <ellipse cx="430" cy="740" rx="60" ry="22" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
  <text x="430" y="745" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">7. 가입완료 ✓</text>
</svg>







