<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="950" height="1020" viewBox="0 0 950 1020">
  <!-- 배경 -->
  <rect x="0" y="0" width="950" height="1020" fill="#ffffff"/>
  
  <!-- 제목 -->
  <text x="475" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f59e0b">★ 기존 가입자</text>
  
  <!-- 0. 로그인 정보입력 -->
  <ellipse cx="450" cy="50" rx="90" ry="24" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
  <text x="450" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">0. 로그인 정보입력</text>
  <text x="450" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff">(ID / 카카오 / 네이버)</text>
  
  <!-- 화살표 -->
  <line x1="450" y1="74" x2="450" y2="97" stroke="#64748b" stroke-width="2"/>
  <polygon points="450,104 445,94 455,94" fill="#64748b"/>
  
  <!-- 마름모: 보편대상자 DB 일치? -->
  <polygon points="450,110 550,160 450,210 350,160" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="500">보편대상자</text>
  <text x="450" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="500">DB 일치?</text>
  
  <!-- 보편 있음 -->
  <line x1="350" y1="160" x2="200" y2="160" stroke="#64748b" stroke-width="2"/>
  <line x1="200" y1="160" x2="200" y2="210" stroke="#64748b" stroke-width="2"/>
  <polygon points="200,217 195,207 205,207" fill="#64748b"/>
  <text x="275" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#16a34a" font-weight="bold">있음</text>
  
  <!-- 보편 없음 -->
  <line x1="550" y1="160" x2="700" y2="160" stroke="#64748b" stroke-width="2"/>
  <line x1="700" y1="160" x2="700" y2="210" stroke="#64748b" stroke-width="2"/>
  <polygon points="700,217 695,207 705,207" fill="#64748b"/>
  <text x="625" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc2626" font-weight="bold">없음</text>
  
  <!-- 마름모: 로그인 형식? (보편 있음) -->
  <polygon points="200,220 280,260 200,300 120,260" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="200" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="500">로그인 형식?</text>
  
  <!-- ============ 보편+ID/PASS 경로 ============ -->
  <line x1="120" y1="260" x2="60" y2="260" stroke="#64748b" stroke-width="2"/>
  <line x1="60" y1="260" x2="60" y2="330" stroke="#64748b" stroke-width="2"/>
  <polygon points="60,337 55,327 65,327" fill="#64748b"/>
  <text x="90" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#16a34a" font-weight="bold">ID/PASS</text>
  
  <!-- 5-1. 계정통합 (보편+ID) -->
  <rect x="10" y="340" width="100" height="50" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="60" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="500">5-1. 계정통합</text>
  <text x="60" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#64748b">(SKIP 가능)</text>
  
  <!-- 보편+ID → 바로 7. 생체정보로 -->
  <line x1="60" y1="390" x2="60" y2="880" stroke="#64748b" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="60" y1="880" x2="320" y2="880" stroke="#64748b" stroke-width="2"/>
  <polygon points="327,880 317,875 317,885" fill="#64748b"/>
  <text x="60" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#22c55e">→ 7. 생체정보로 바로 이동</text>
  
  <!-- ============ 보편+소셜 경로 ============ -->
  <line x1="280" y1="260" x2="340" y2="260" stroke="#64748b" stroke-width="2"/>
  <line x1="340" y1="260" x2="340" y2="350" stroke="#64748b" stroke-width="2"/>
  <line x1="340" y1="350" x2="343" y2="350" stroke="#64748b" stroke-width="2"/>
  <polygon points="350,350 340,345 340,355" fill="#64748b"/>
  <text x="310" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dc2626" font-weight="bold">소셜</text>
  
  <!-- ============ 사업대상자 경로 ============ -->
  <polygon points="700,220 780,260 700,300 620,260" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="700" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="500">사업대상자</text>
  <text x="700" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="500">DB 일치?</text>
  
  <!-- 사업 있음 → 3. 약관동의로 -->
  <line x1="620" y1="260" x2="550" y2="260" stroke="#64748b" stroke-width="2"/>
  <line x1="550" y1="260" x2="550" y2="350" stroke="#64748b" stroke-width="2"/>
  <line x1="550" y1="350" x2="557" y2="350" stroke="#64748b" stroke-width="2"/>
  <polygon points="550,350 560,345 560,355" fill="#64748b"/>
  <text x="585" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#16a34a" font-weight="bold">있음</text>
  
  <!-- 사업 없음 -->
  <line x1="780" y1="260" x2="840" y2="260" stroke="#64748b" stroke-width="2"/>
  <line x1="840" y1="260" x2="840" y2="330" stroke="#64748b" stroke-width="2"/>
  <polygon points="840,337 835,327 845,327" fill="#64748b"/>
  <text x="810" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dc2626" font-weight="bold">없음</text>
  
  <rect x="780" y="340" width="120" height="40" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="840" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#991b1b">로그인 실패</text>
  <text x="840" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#991b1b">→ 0번으로</text>
  
  <!-- 3. 약관동의 (통합) -->
  <rect x="350" y="330" width="200" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">3. 약관동의</text>
  
  <!-- 3. 약관동의 → 4. 본인인증 -->
  <line x1="450" y1="370" x2="450" y2="400" stroke="#64748b" stroke-width="2"/>
  <polygon points="450,407 445,397 455,397" fill="#64748b"/>
  
  <!-- 4. 본인인증 -->
  <rect x="350" y="410" width="200" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">4. 본인인증 (PASS인증)</text>
  
  <!-- 화살표 -->
  <line x1="450" y1="450" x2="450" y2="480" stroke="#64748b" stroke-width="2"/>
  <polygon points="450,487 445,477 455,477" fill="#64748b"/>
  
  <!-- 5-1. 계정통합 안내 (기본) -->
  <rect x="320" y="490" width="260" height="50" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="450" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="500">5-1. 계정통합 안내 (기본)</text>
  <text x="450" y="529" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">CI 기반으로 보편 DB 검색</text>
  
  <!-- 화살표 -->
  <line x1="450" y1="540" x2="450" y2="570" stroke="#64748b" stroke-width="2"/>
  <polygon points="450,577 445,567 455,567" fill="#64748b"/>
  
  <!-- 마름모: 보편 DB에 CI 있음? -->
  <polygon points="450,580 550,630 450,680 350,630" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="623" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="500">보편 DB에</text>
  <text x="450" y="638" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="500">CI 있음?</text>
  
  <!-- CI 있음: 5-2 계정통합 -->
  <line x1="350" y1="630" x2="200" y2="630" stroke="#64748b" stroke-width="2"/>
  <line x1="200" y1="630" x2="200" y2="690" stroke="#64748b" stroke-width="2"/>
  <polygon points="200,697 195,687 205,687" fill="#64748b"/>
  <text x="275" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#16a34a" font-weight="bold">있음</text>
  
  <rect x="100" y="700" width="200" height="50" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="200" y="722" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="500">5-2. 계정통합 안내 (특수)</text>
  <text x="200" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">사용할 ID 선택</text>
  
  <!-- CI 없음: 6 개인정보 변경 -->
  <line x1="550" y1="630" x2="700" y2="630" stroke="#64748b" stroke-width="2"/>
  <line x1="700" y1="630" x2="700" y2="690" stroke="#64748b" stroke-width="2"/>
  <polygon points="700,697 695,687 705,687" fill="#64748b"/>
  <text x="625" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dc2626" font-weight="bold">없음</text>
  
  <rect x="600" y="700" width="200" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="700" y="722" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">6. 개인정보 변경 안내</text>
  <text x="700" y="740" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">이름, 생년월일, 휴대폰, 성별</text>
  
  <!-- 5-2, 6 → 합류 -->
  <line x1="200" y1="750" x2="200" y2="800" stroke="#64748b" stroke-width="2"/>
  <line x1="700" y1="750" x2="700" y2="800" stroke="#64748b" stroke-width="2"/>
  <line x1="200" y1="800" x2="700" y2="800" stroke="#64748b" stroke-width="2"/>
  <line x1="450" y1="800" x2="450" y2="850" stroke="#64748b" stroke-width="2"/>
  <polygon points="450,857 445,847 455,847" fill="#64748b"/>
  
  <!-- 7. 생체정보 -->
  <rect x="320" y="860" width="260" height="45" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="450" y="880" text-anchor="middle" font-family="Arial, sans-serif" font-size="11">7. 생체정보</text>
  <text x="450" y="895" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">키, 몸무게, 활동계수, 관심보건소</text>
  
  <!-- 화살표 -->
  <line x1="450" y1="905" x2="450" y2="940" stroke="#64748b" stroke-width="2"/>
  <polygon points="450,947 445,937 455,937" fill="#64748b"/>
  
  <!-- 8. 가입완료 -->
  <ellipse cx="450" cy="970" rx="60" ry="22" fill="#a78bfa" stroke="#7c3aed" stroke-width="2"/>
  <text x="450" y="975" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">8. 가입완료 ✓</text>
  
  <!-- 범례 박스 -->
  <rect x="720" y="390" width="220" height="140" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="830" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fbbf24">※ 흐름 요약</text>
  <line x1="740" y1="435" x2="920" y2="435" stroke="#475569" stroke-width="1"/>
  <text x="740" y="460" font-family="Arial, sans-serif" font-size="11" fill="#f1f5f9" font-weight="500">• 보편+ID → 5-1 → 7 (바로)</text>
  <text x="740" y="485" font-family="Arial, sans-serif" font-size="11" fill="#f1f5f9" font-weight="500">• 보편+소셜 → 4 → 5-1 → CI검색</text>
  <text x="740" y="510" font-family="Arial, sans-serif" font-size="11" fill="#f1f5f9" font-weight="500">• 사업대상자 → 4 → 5-1 → CI검색</text>
  
  <text x="80" y="455" font-family="Arial, sans-serif" font-size="9" fill="#64748b">(점선: 바로 이동)</text>
</svg>







